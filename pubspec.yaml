name: movie_match
description: Movie discovery app with group watchlist and offline sync.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # --- State Management ---
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # --- Dependency Injection ---
  get_it: ^7.7.0
  injectable: ^2.4.4

  # --- Network ---
  dio: ^5.7.0
  dio_smart_retry: ^6.0.0
  connectivity_plus: ^6.1.0
  pretty_dio_logger: ^1.4.0

  # --- Local Database ---
  drift: ^2.20.3
  drift_flutter: ^0.2.1
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # --- Background Sync ---
  workmanager: ^0.5.2

  # --- UI ---
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  go_router: ^14.6.2

  # --- Utils ---
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.3.3
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code Generation ---
  build_runner: ^2.4.13
  injectable_generator: ^2.6.2
  drift_dev: ^2.20.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/